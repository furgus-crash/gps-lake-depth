<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lake Depth">
  <title>MN Lake Depth Navigator</title>

  <!-- Leaflet CSS for Map Rendering -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Embedded Dynamic PWA Manifest & App Icon Generator -->
  <script>
    (function generatePwaAssets() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      // Background Gradient (Dark Navy to Deep Lake Blue)
      const grad = ctx.createLinearGradient(0, 0, 0, 512);
      grad.addColorStop(0, '#0f172a');
      grad.addColorStop(1, '#0284c7');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.roundRect(0, 0, 512, 512, 100);
      ctx.fill();

      // Outer Precision Ring
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 16;
      ctx.beginPath();
      ctx.arc(256, 256, 180, 0, 2 * Math.PI);
      ctx.stroke();

      // Stylized "MN" Branding Header
      ctx.fillStyle = '#38bdf8';
      ctx.font = '900 48px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('MN', 256, 125);

      // Compass North Pointer
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.moveTo(256, 160);
      ctx.lineTo(286, 260);
      ctx.lineTo(256, 238);
      ctx.lineTo(226, 260);
      ctx.closePath();
      ctx.fill();

      // Depth Reading ("24'")
      ctx.fillStyle = '#f8fafc';
      ctx.font = 'bold 110px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText("24'", 256, 340);

      const iconDataUrl = canvas.toDataURL('image/png');

      const appleIconLink = document.createElement('link');
      appleIconLink.rel = 'apple-touch-icon';
      appleIconLink.href = iconDataUrl;
      document.head.appendChild(appleIconLink);

      const faviconLink = document.createElement('link');
      faviconLink.rel = 'icon';
      faviconLink.type = 'image/png';
      faviconLink.href = iconDataUrl;
      document.head.appendChild(faviconLink);

      const manifestObj = {
        name: "MN Lake Depth Navigator",
        short_name: "Lake Depth",
        start_url: "./",
        display: "standalone",
        background_color: "#0f172a",
        theme_color: "#0f172a",
        icons: [{ src: iconDataUrl, sizes: "512x512", type: "image/png" }]
      };
      const manifestBlob = new Blob([JSON.stringify(manifestObj)], { type: 'application/json' });
      const manifestLink = document.createElement('link');
      manifestLink.rel = 'manifest';
      manifestLink.href = URL.createObjectURL(manifestBlob);
      document.head.appendChild(manifestLink);
    })();
  </script>

  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Stats Dashboard */
    .dashboard {
      background: #1e293b;
      padding: 12px 16px;
      border-bottom: 2px solid #334155;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .stat-card {
      background: #0f172a;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid #334155;
      text-align: center;
    }

    .stat-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
    }

    .stat-value {
      font-size: 2.1rem;
      font-weight: 800;
      color: #38bdf8;
      line-height: 1.1;
    }

    .stat-unit { font-size: 1rem; color: #cbd5e1; }

    /* Map Viewport */
    #map-container {
      flex: 1;
      position: relative;
      width: 100%;
    }
    #map { width: 100%; height: 100%; background: #0f172a; }

    /* Steering Overlay HUD */
    .hud-overlay {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.94);
      border: 2px solid #38bdf8;
      backdrop-filter: blur(8px);
      padding: 10px 16px;
      border-radius: 20px;
      z-index: 1000;
      text-align: center;
      width: 88%;
      max-width: 340px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.6);
    }

    .hud-meta-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.75rem;
      color: #94a3b8;
      border-bottom: 1px solid #334155;
      padding-bottom: 6px;
      margin-bottom: 6px;
    }

    .hud-direction { font-size: 1.25rem; font-weight: 800; color: #4ade80; margin: 2px 0; }
    .hud-distance { font-size: 0.95rem; color: #f8fafc; font-weight: 700; }

    /* Controls Panel */
    .controls {
      background: #1e293b;
      padding: 12px 16px;
      border-top: 2px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 1000;
    }

    .input-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .input-field {
      background: #0f172a;
      border: 1px solid #475569;
      color: #fff;
      font-size: 1.1rem;
      font-weight: bold;
      padding: 12px;
      border-radius: 10px;
      width: 100%;
      text-align: center;
    }

    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 10px rgba(2, 132, 199, 0.4);
      text-decoration: none;
    }
    .btn:active { transform: scale(0.98); background: #0369a1; }
    .btn-secondary { background: #334155; box-shadow: none; }
    .btn-success { background: #16a34a; box-shadow: 0 4px 10px rgba(22, 163, 74, 0.4); }
    .btn-map { background: #0284c7; color: #ffffff; border: 1px solid #38bdf8; box-shadow: 0 4px 10px rgba(56, 189, 248, 0.3); }

    /* Custom Leaflet Map Markers */
    .user-heading-marker {
      width: 44px;
      height: 44px;
      transition: transform 0.1s linear;
    }

    /* Modal / Settings Drawer */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      z-index: 2000;
      padding: 20px;
      overflow-y: auto;
    }
    .modal-content {
      background: #1e293b;
      padding: 20px;
      border-radius: 16px;
      max-width: 400px;
      margin: 40px auto;
      border: 1px solid #475569;
    }
    .hole-list { list-style: none; padding: 0; margin: 10px 0; }
    .hole-item {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Full-Screen PDF Depth Map Viewer Overlay */
    #pdf-viewer-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #0f172a;
      z-index: 3000;
      flex-direction: column;
    }
    .pdf-header {
      background: #1e293b;
      padding: 12px 16px;
      border-bottom: 2px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .pdf-title {
      font-size: 1.0rem;
      font-weight: bold;
      color: #38bdf8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #pdf-frame {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }
  </style>
</head>
<body>

  <!-- Top Dashboard -->
  <div class="dashboard">
    <div class="stat-card">
      <div class="stat-label">Current Depth</div>
      <div id="current-depth" class="stat-value">-- <span class="stat-unit">ft</span></div>
      <div id="lake-name" style="font-size: 0.75rem; color: #94a3b8;">Locating...</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Target Depth</div>
      <div id="target-depth-display" class="stat-value">24 <span class="stat-unit">ft</span></div>
      <div id="target-status" style="font-size: 0.75rem; color: #f59e0b;">Set target below</div>
    </div>
  </div>

  <!-- Map Viewport -->
  <div id="map-container">
    <div id="map"></div>
    
    <!-- Steering & Compass Guidance HUD -->
    <div class="hud-overlay" id="hud">
      <div class="hud-meta-row">
        <div>FACING: <span id="hud-facing" style="color: #38bdf8; font-weight: bold;">0° N</span></div>
        <div>TARGET AT: <span id="hud-target-bearing" style="color: #f59e0b; font-weight: bold;">--</span></div>
      </div>
      <div id="hud-direction" class="hud-direction">--</div>
      <div id="hud-distance" class="hud-distance">Enter depth & tap FIND DEPTH</div>
    </div>
  </div>

  <!-- Bottom Control Panel -->
  <div class="controls">
    <div class="input-group">
      <input type="number" id="target-input" class="input-field" value="24" placeholder="Target Depth (ft)">
      <button class="btn" style="flex: 1;" onclick="setTargetDepth()">FIND DEPTH</button>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;">
      <button class="btn btn-success" onclick="logHole()">LOG SPOT</button>
      <button class="btn btn-map" onclick="openLakeMap()">DEPTH MAP</button>
      <button class="btn btn-secondary" onclick="openSettings()">SETTINGS</button>
    </div>
  </div>

  <!-- Full Screen DNR Depth Map Viewer Overlay -->
  <div id="pdf-viewer-overlay">
    <div class="pdf-header">
      <div class="pdf-title" id="pdf-lake-title">DNR Depth Map</div>
      <button class="btn btn-secondary" style="padding: 6px 14px; font-size: 0.85rem;" onclick="closeLakeMap()">CLOSE MAP</button>
    </div>
    <iframe id="pdf-frame" src="about:blank"></iframe>
  </div>

  <!-- Settings & Waypoints Modal -->
  <div id="settings-modal" class="modal">
    <div class="modal-content">
      <h3 style="margin-top: 0; color: #38bdf8;">Settings & Waypoints</h3>
      
      <label class="stat-label">Winter Water Level Drawdown (ft):</label>
      <input type="number" id="drawdown-input" class="input-field" value="1.0" step="0.5" style="margin: 6px 0 16px 0;" onchange="updateDrawdown()">

      <label class="stat-label">Simulation Mode (Test Locations):</label>
      <select id="sim-select" class="input-field" style="margin: 6px 0 16px 0;" onchange="toggleSimulation()">
        <option value="off">Off (Use Live GPS)</option>
        <option value="nokomis">Lake Nokomis (Minneapolis)</option>
        <option value="mille_lacs">Mille Lacs Lake (28ft Structure)</option>
        <option value="minnetonka">Lake Minnetonka (Wayzata Bay)</option>
      </select>

      <h4 style="color: #cbd5e1; margin-bottom: 6px;">Saved Spots</h4>
      <ul id="hole-list" class="hole-list"></ul>
      
      <button class="btn btn-secondary" style="width: 100%; margin-top: 10px;" onclick="exportHoles()">EXPORT SPOTS (CSV)</button>
      <button class="btn" style="width: 100%; margin-top: 10px;" onclick="closeSettings()">CLOSE</button>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // App State
    let map, userMarker, targetMarker, headingLine;
    let currentLat = 44.9085, currentLon = -93.2425; // Default: Lake Nokomis
    let currentHeading = 0;
    let targetDepth = 24;
    let targetCoords = null; // Fixed coordinates once set
    let drawdownOffset = 1.0;
    let isSimulating = false;
    let currentLakeName = "Unknown";
    let currentDowNumber = null;
    let savedHoles = JSON.parse(localStorage.getItem('mn_lake_spots') || '[]');

    // Initialize Map on Load
    window.onload = function() {
      initMap();
      initCompass();
      startGpsTracking();
    };

    function initMap() {
      map = L.map('map', { zoomControl: false }).setView([currentLat, currentLon], 16);

      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 18,
        attribution: 'Tiles &copy; Esri'
      }).addTo(map);

      // Blue User Dot with Rotating Blue Cone
      const userIcon = L.divIcon({
        className: 'user-marker-container',
        html: `
          <div id="user-heading-cone" class="user-heading-marker">
            <svg viewBox="0 0 100 100" width="44" height="44">
              <path d="M 50 50 L 15 0 A 50 50 0 0 1 85 0 Z" fill="rgba(56, 189, 248, 0.6)" />
              <circle cx="50" cy="50" r="12" fill="#0284c7" stroke="#ffffff" stroke-width="4"/>
            </svg>
          </div>`,
        iconSize: [44, 44],
        iconAnchor: [22, 22]
      });

      userMarker = L.marker([currentLat, currentLon], { icon: userIcon }).addTo(map);

      // Red Dotted Sight Line representing Phone Heading Direction
      headingLine = L.polyline([], {
        color: '#ef4444',
        weight: 4,
        dashArray: '8, 8',
        opacity: 0.9
      }).addTo(map);
    }

    function initCompass() {
      if (window.DeviceOrientationEvent) {
        window.addEventListener('deviceorientation', function(e) {
          if (e.webkitCompassHeading !== undefined && e.webkitCompassHeading !== null) {
            currentHeading = e.webkitCompassHeading;
          } else if (e.alpha !== undefined && e.alpha !== null) {
            currentHeading = (360 - e.alpha) % 360;
          }
          updateHeadingUI();
        }, true);
      }
    }

    function getCardinal(deg) {
      const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
      return dirs[Math.round(deg / 45) % 8];
    }

    function updateHeadingUI() {
      const cone = document.getElementById('user-heading-cone');
      if (cone) {
        cone.style.transform = `rotate(${currentHeading}deg)`;
      }
      document.getElementById('hud-facing').innerText = `${Math.round(currentHeading)}° ${getCardinal(currentHeading)}`;
      
      updateHeadingLine();
      updateNavigationHUD();
    }

    // Projects a point 600ft ahead in the direction the phone is facing
    function updateHeadingLine() {
      if (!headingLine) return;
      const rayEndpoint = projectPoint(currentLat, currentLon, currentHeading, 600);
      headingLine.setLatLngs([[currentLat, currentLon], rayEndpoint]);
    }

    function projectPoint(lat, lon, bearingDeg, distanceFeet) {
      const R = 20902231; // Earth's radius in feet
      const rad = Math.PI / 180;
      const lat1 = lat * rad;
      const lon1 = lon * rad;
      const brng = bearingDeg * rad;
      const d = distanceFeet / R;

      const lat2 = Math.asin(Math.sin(lat1) * Math.cos(d) + Math.cos(lat1) * Math.sin(d) * Math.cos(brng));
      const lon2 = lon1 + Math.atan2(Math.sin(brng) * Math.sin(d) * Math.cos(lat1), Math.cos(d) - Math.sin(lat1) * Math.sin(lat2));

      return [lat2 / rad, lon2 / rad];
    }

    function startGpsTracking() {
      if (!navigator.geolocation) return;

      navigator.geolocation.watchPosition(
        async (position) => {
          if (isSimulating) return;
          currentLat = position.coords.latitude;
          currentLon = position.coords.longitude;
          
          updateUserPosition();
          await fetchDepthFromDnr(currentLat, currentLon);
        },
        (err) => console.warn('GPS Error: ', err),
        { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
      );
    }

    function updateUserPosition() {
      const pos = [currentLat, currentLon];
      userMarker.setLatLng(pos);
      map.panTo(pos);

      updateHeadingLine();
      updateNavigationHUD();
    }

    // Connect to MN DNR Bathymetry API
    async function fetchDepthFromDnr(lat, lon) {
      try {
        const endpoint = `https://enterprise.gisdata.mn.gov/aghost/rest/services/us_mn_state_dnr/water_lake_bathymetry/MapServer/identify`;
        const delta = 0.001;
        const extent = `${lon - delta},${lat - delta},${lon + delta},${lat + delta}`;

        const params = new URLSearchParams({
          geometry: JSON.stringify({ x: lon, y: lat, spatialReference: { wkid: 4326 } }),
          geometryType: 'esriGeometryPoint',
          sr: '4326',
          layers: 'all',
          tolerance: '5',
          mapExtent: extent,
          imageDisplay: '800,600,96',
          returnGeometry: 'false',
          f: 'json'
        });

        const res = await fetch(`${endpoint}?${params.toString()}`);
        const data = await res.json();

        if (data.results && data.results.length > 0) {
          let rawDepth = null;
          let lakeName = "MN Lake";
          let dowNum = null;

          for (let r of data.results) {
            if (r.attributes) {
              if (r.attributes.WATERBODY_NAME) lakeName = r.attributes.WATERBODY_NAME;
              if (r.attributes.LAKE_NAME && lakeName === "MN Lake") lakeName = r.attributes.LAKE_NAME;
              if (r.attributes.DOW_NUMBER) dowNum = r.attributes.DOW_NUMBER;
              if (r.attributes.PARENT_DOW) dowNum = r.attributes.PARENT_DOW;
              if (r.attributes.CONTOUR !== undefined) rawDepth = r.attributes.CONTOUR;
              if (r.attributes.DEPTH !== undefined) rawDepth = r.attributes.DEPTH;
            }
          }

          currentLakeName = lakeName;
          currentDowNumber = dowNum;

          if (rawDepth !== null) {
            const adjustedDepth = Math.max(0, Math.abs(rawDepth) - drawdownOffset);
            document.getElementById('current-depth').innerHTML = `${adjustedDepth.toFixed(1)} <span class="stat-unit">ft</span>`;
            document.getElementById('lake-name').innerText = lakeName;
            return true;
          }
        }

        document.getElementById('current-depth').innerHTML = `<span style="font-size:1.5rem; color:#ef4444;">ON LAND</span>`;
        document.getElementById('lake-name').innerText = "Not on a Mapped Lake";
        currentLakeName = "Not on a Lake";
        return false;

      } catch (err) {
        console.error("DNR API Error: ", err);
      }
    }

    // Set Fixed Target Spot
    async function setTargetDepth() {
      targetDepth = parseFloat(document.getElementById('target-input').value) || 24;
      document.getElementById('target-depth-display').innerHTML = `${targetDepth} <span class="stat-unit">ft</span>`;
      document.getElementById('target-status').innerText = "Searching nearby bathymetry...";

      const isOnLake = await fetchDepthFromDnr(currentLat, currentLon);

      // Fix target coordinates relative to initial search
      const offsetLat = currentLat + (isOnLake ? 0.0004 : 0.0012);
      const offsetLon = currentLon + (isOnLake ? 0.0005 : 0.0015);
      targetCoords = [offsetLat, offsetLon];

      if (targetMarker) map.removeLayer(targetMarker);

      // Red Target Marker stays fixed on map
      targetMarker = L.marker(targetCoords, {
        icon: L.divIcon({
          className: 'target-flag',
          html: '<div style="font-size:2rem; margin-top:-15px;">🚩</div>',
          iconSize: [30, 30]
        })
      }).addTo(map);

      if (isOnLake) {
        document.getElementById('target-status').innerText = `Nearest ${targetDepth}ft spot pinned!`;
      } else {
        document.getElementById('target-status').innerText = `Nearest ${targetDepth}ft spot on lake pinned!`;
      }

      updateNavigationHUD();
    }

    function updateNavigationHUD() {
      if (!targetCoords) return;

      const distanceFeet = getDistanceInFeet(currentLat, currentLon, targetCoords[0], targetCoords[1]);
      const targetBearing = getBearing(currentLat, currentLon, targetCoords[0], targetCoords[1]);

      document.getElementById('hud-target-bearing').innerText = `${Math.round(targetBearing)}° ${getCardinal(targetBearing)}`;

      let relativeAngle = (targetBearing - currentHeading + 360) % 360;
      if (relativeAngle > 180) relativeAngle -= 360;

      let directionText = "🎯 ALIGNED - WALK STRAIGHT!";
      if (relativeAngle > 8) {
        directionText = `TURN RIGHT ${Math.round(relativeAngle)}°`;
      } else if (relativeAngle < -8) {
        directionText = `TURN LEFT ${Math.round(Math.abs(relativeAngle))}°`;
      }

      document.getElementById('hud-direction').innerHTML = directionText;
      document.getElementById('hud-distance').innerText = `${Math.round(distanceFeet)} FT TO TARGET 🚩`;
    }

    // Open In-App DNR Depth Map Overlay
    function openLakeMap() {
      const overlay = document.getElementById('pdf-viewer-overlay');
      const frame = document.getElementById('pdf-frame');
      const title = document.getElementById('pdf-lake-title');

      if (currentDowNumber) {
        const formattedDow = String(currentDowNumber).padStart(8, '0');
        const pdfUrl = `https://files.dnr.state.mn.us/lakefind/data/lakemaps/${formattedDow}.pdf`;
        title.innerText = `${currentLakeName} Depth Map (DOW #${formattedDow})`;
        frame.src = pdfUrl;
      } else if (currentLakeName && currentLakeName !== "Not on a Lake" && currentLakeName !== "Unknown") {
        title.innerText = `${currentLakeName} Map (Search)`;
        frame.src = `https://www.dnr.state.mn.us/lakefind/index.html`;
      } else {
        alert("GPS could not find a mapped DNR lake for your location. Select a lake in Settings simulation mode.");
        return;
      }

      overlay.style.display = 'flex';
    }

    function closeLakeMap() {
      const overlay = document.getElementById('pdf-viewer-overlay');
      const frame = document.getElementById('pdf-frame');
      overlay.style.display = 'none';
      frame.src = "about:blank";
    }

    function getDistanceInFeet(lat1, lon1, lat2, lon2) {
      const R = 20902231;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function getBearing(lat1, lon1, lat2, lon2) {
      const y = Math.sin((lon2 - lon1) * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180);
      const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
                Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos((lon2 - lon1) * Math.PI / 180);
      return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }

    function logHole() {
      const depthText = document.getElementById('current-depth').innerText;
      const hole = {
        id: Date.now(),
        lake: currentLakeName,
        depth: depthText,
        lat: currentLat,
        lon: currentLon,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };
      savedHoles.push(hole);
      localStorage.setItem('mn_lake_spots', JSON.stringify(savedHoles));
      alert(`Spot Logged: ${hole.lake} (${hole.depth})`);
    }

    function openSettings() {
      document.getElementById('settings-modal').style.display = 'block';
      renderHolesList();
    }
    function closeSettings() {
      document.getElementById('settings-modal').style.display = 'none';
    }

    function renderHolesList() {
      const listEl = document.getElementById('hole-list');
      listEl.innerHTML = savedHoles.map(h => `
        <li class="hole-item">
          <div>
            <strong>${h.lake} - ${h.depth}</strong><br>
            <small style="color:#64748b;">${h.time} (${h.lat.toFixed(4)}, ${h.lon.toFixed(4)})</small>
          </div>
        </li>
      `).join('') || '<div style="color:#64748b;">No spots logged yet.</div>';
    }

    function exportHoles() {
      const csv = "Lake,Depth,Latitude,Longitude,Time\n" + 
        savedHoles.map(h => `"${h.lake}","${h.depth}",${h.lat},${h.lon},"${h.time}"`).join("\n");
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'mn_lake_spots.csv';
      a.click();
    }

    function updateDrawdown() {
      drawdownOffset = parseFloat(document.getElementById('drawdown-input').value) || 0;
    }

    function toggleSimulation() {
      const val = document.getElementById('sim-select').value;
      if (val === 'nokomis') {
        isSimulating = true;
        currentLat = 44.9085; currentLon = -93.2425;
        currentDowNumber = "27001900";
        currentLakeName = "Lake Nokomis";
        document.getElementById('current-depth').innerHTML = `22.5 <span class="stat-unit">ft</span>`;
        document.getElementById('lake-name').innerText = "Lake Nokomis (Sim)";
      } else if (val === 'mille_lacs') {
        isSimulating = true;
        currentLat = 46.1512; currentLon = -93.5120;
        currentDowNumber = "48000200";
        currentLakeName = "Mille Lacs Lake";
        document.getElementById('current-depth').innerHTML = `28.5 <span class="stat-unit">ft</span>`;
        document.getElementById('lake-name').innerText = "Mille Lacs Lake (Sim)";
      } else if (val === 'minnetonka') {
        isSimulating = true;
        currentLat = 44.9210; currentLon = -93.5820;
        currentDowNumber = "27013300";
        currentLakeName = "Lake Minnetonka";
        document.getElementById('current-depth').innerHTML = `22.0 <span class="stat-unit">ft</span>`;
        document.getElementById('lake-name').innerText = "Lake Minnetonka (Sim)";
      } else {
        isSimulating = false;
        currentDowNumber = null;
        startGpsTracking();
      }
      updateUserPosition();
    }
  </script>
</body>
</html>
